name: ECSRelay Tunnel
version: "0.1.75"
slug: ecsrelay
description: 反向隧道 agent —— 让 Home Assistant 在没有端口映射的情况下也能从外网访问
url: https://github.com/AwesomeSky/ecsrelay-addon
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false

# 用 ingress 让配对页直接开在 HA 自己的界面里（点「打开 Web UI」就在 HA 内打开），
# 不额外加侧边栏面板；同时保留端口映射，作为 ingress 走不通时的备选入口。
ingress: true
ingress_port: 28445
ports:
  "28445/tcp": 28445
ports_description:
  "28445/tcp": 配对页备选入口（ingress 走不通时用；会签发设备令牌，请配合 pairPin）

options:
  relay: ""
  pin: ""
  relayPublic: ""
  pinPublic: ""
  token: ""
  room: home
  target: homeassistant:80
  pairPin: ""
schema:
  relay: str
  pin: str
  relayPublic: "str?"
  pinPublic: "str?"
  token: password
  room: str
  target: str
  pairPin: password